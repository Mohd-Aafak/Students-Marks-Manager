<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>students marks manager</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div class="container">
        <h1>Student Marks Manager</h1>
        <p>Total Students: <span id="std-value">0</span></p>
        <p>Average Marks: <span id="avg-value">0</span></p>
        <input type="text" id="std-input" placeholder="Enter Student Name">   
        <input type="number" id="mrk-input" placeholder="Enter Marks">
        <button id="add-std">Add Student</button>
        <div class="stdShow-container"></div> 
    </div>
</body>
</html>
